<!doctype html>
<html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עזרה - העוזר האישי שלך</title><link rel="icon" href="ezra-icon.svg">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172b46;--blue:#245aa5;--soft:#e9f0fa;--muted:#536780;--line:#d7e2ef;--stop:#ffe6e4}*{box-sizing:border-box}body{margin:0;background:#e9eef5;color:var(--ink);font-family:Arial,sans-serif;line-height:1.45}.dark{--bg:#101b2b;--card:#19283c;--ink:#f2f5fa;--blue:#a7c8ff;--soft:#263c59;--muted:#c4d1e1;--line:#354860;--stop:#683532}header{max-width:1400px;margin:36px auto;padding:0 26px;color:#172b46;display:flex;gap:20px;align-items:center;justify-content:space-between}h1{margin:0 0 8px;font-size:36px}.intro{font-size:19px;margin:0;color:#536780}button,input,select{font:inherit}button{cursor:pointer}header button{padding:12px 18px;border:1px solid #b7c9df;border-radius:12px;background:#fff;color:#172b46;font-size:18px}.board{display:grid;grid-template-columns:repeat(3,minmax(300px,390px));gap:34px;justify-content:center;padding:12px 24px 50px}.label{color:#536780;font-size:17px;font-weight:bold;margin:0 8px 12px}.phone{height:920px;border:8px solid #263549;border-radius:40px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 16px 38px #233e5a18}.statusbar{font-size:13px;display:flex;justify-content:space-between;padding:12px 20px 0;color:var(--muted)}.brand{display:flex;align-items:center;gap:9px;padding:18px 16px}.brand img{width:30px;height:30px}.brand b{font-size:18px;white-space:nowrap}.gear{font-size:23px;color:var(--blue);margin-right:auto}.content{flex:1;overflow:auto;padding:8px 20px 22px;scrollbar-width:thin}h2{font-size:28px;margin:0 0 12px}h3{font-size:23px;margin:0 0 12px}.sub,.note{font-size:18px;color:var(--muted);margin:0 0 14px}.ready{font-size:16px;color:var(--blue);margin:0 0 18px}.action{display:block;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;min-height:64px;padding:14px;text-align:right;font-size:22px;font-weight:bold;margin:12px 0}.primary{background:var(--blue);color:var(--bg);border-color:var(--blue)}.mic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:0;border-radius:50%;width:208px;height:208px;background:var(--blue);color:var(--bg);margin:20px auto 10px}.mic svg{width:48px;height:48px}.mic b{font-size:29px}.micnote{text-align:center;font-size:18px;color:var(--muted);margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:16px 0;font-size:21px}.field{display:block;font-size:17px;color:var(--muted);margin:14px 0}.field input,.field select{display:block;width:100%;padding:13px;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:21px}.field input[type=range]{accent-color:var(--blue);padding:0;height:30px}.foot{display:flex;gap:10px;padding:12px 12px 20px;background:var(--card);border-top:1px solid var(--line)}.foot button{flex:1;min-height:64px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;font-size:22px;font-weight:bold}.foot .stop{background:var(--stop);border:0}.check{padding:12px 0;border-bottom:1px solid var(--line);font-size:21px}.time{float:left;color:var(--blue);font-weight:bold}.guide{padding:14px;border-radius:12px;background:var(--soft);font-size:18px;margin:14px 0}table{border-collapse:collapse;width:100%;font-size:16px}th,td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right}footer{text-align:center;color:#536780;font-size:18px;padding:10px 24px 36px}.large .action,.large .card{font-size:25px}.large .field input{font-size:25px}.large .note,.large .sub{font-size:22px}.icon-preview{width:112px;height:112px;display:block;margin:20px auto}.center{text-align:center}@media(max-width:1120px){.board{grid-template-columns:repeat(2,minmax(300px,390px))}}@media(max-width:740px){.board{grid-template-columns:minmax(290px,390px);padding:12px 14px 36px}header{display:block}h1{font-size:28px}header button{margin:16px 0 0}}
</style>
<header><div><h1>עזרה - העוזר האישי שלך</h1><p class="intro">מסכים מעודכנים · כל ההגדרות גלויות · דוגמאות עיצוב בלבד</p></div><div><button onclick="document.body.classList.toggle('dark')">בהיר / כהה</button> <button onclick="document.body.classList.toggle('large')">הגדלת טקסט</button></div></header>
<main class="board" id="board"></main><footer>הדמיה בלבד. באפליקציה מזינים את הפרטים, התרופות והשעות האישיים. אין כאן מידע רפואי או חדשות חיות.</footer>
<script>
const action=(s,primary=false)=>`<button class="action ${primary?'primary':''}">${s}</button>`;
const field=(label,value='')=>`<label class="field">${label}<input value="${value}" readonly></label>`;
const views=[
['01 / הבית — כפתור דיבור עגול',`<div class="ready" id="live">● מוכן להקשיב</div><h2>שלום, יוסף</h2><p class="sub">יום שבת, 17 באוקטובר</p><button class="mic" id="mic"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><rect x="18" y="5" width="12" height="25" rx="6"/><path d="M11 23v2a13 13 0 0026 0v-2M24 38v6M17 44h14"/></svg><b>דבר איתי</b></button><div class="micnote">לחצו ואמרו מה תרצו</div>${action('☀ הבוקר שלי',true)}${action('▤ חדשות')}${action('☎ התקשרות')}${action('▦ מה קרוב')}${action('◉ התרופות שלי')}`],
['02 / תפריט הגדרות — הכול במקום ברור',`<h2>הגדרות למשפחה</h2><p class="sub">בחרו מה להגדיר</p>${action('שם, כתובת ומיקום')}${action('שפה, קול וגודל גופן')}${action('אנשי קשר וימי הולדת')}${action('תרופות לפי חלקי היום')}${action('יומן Google והתראות')}${action('אתרי חדשות וספורט')}${action('גיבוי והעברה')}<p class="note">לכל נושא מסך משלו.</p>`],
['03 / שם, כתובת, עיר ומדינה',`<h2>הפרטים שלי</h2><div class="card">${field('שם המשתמש','יוסף')}${field('כתובת','הכתובת האישית שלך')}${field('חיפוש עיר','חיפה')}${action('⌕ חיפוש עיר')}<div class="guide">מיקום נבחר: חיפה, ישראל<br>אזור זמן: Asia/Jerusalem</div>${action('✓ שמירת ההגדרות',true)}</div><p class="note">בחירת העיר קובעת את המיקום לתחזית מזג האוויר, ללא הרשאת GPS.</p>`],
['04 / שפה, גודל גופן, קול ותצוגה',`<h2>שפה, קול וגודל גופן</h2><div class="card"><label class="field">שפת הדיבור וההקראה<select><option>עברית</option><option>English</option><option>العربية</option></select></label><label class="field">קול זמין במכשיר<select><option>ברירת מחדל — האזינו ובחרו</option></select></label>${action('◖)) בדיקת הקראה')}<label class="field">מהירות דיבור<input type="range" value="35" aria-label="מהירות דיבור"></label><label class="field">גודל גופן<input type="range" value="45" aria-label="גודל גופן"></label><div class="check">◐ תצוגה בהירה / כהה</div>${action('✓ שמירת ההגדרות',true)}</div><p class="note">הממשק והפקודות בעברית. בחירת גבר או אישה תלויה בקולות שבטלפון.</p>`],
['05 / ימי הולדת — Excel או הדבקה',`<h2>אנשי קשר וימי הולדת</h2>${action('＋ הוספת איש קשר')}${action('↑ יבוא קובץ Excel',true)}${action('▣ הדבקת טבלה')}<div class="guide">מאקסל מעתיקים גם את שורת הכותרות, ואז לוחצים ״הדבקה מהלוח״.</div><div class="card"><h3>תצוגה מקדימה ליבוא</h3><table><tr><th>שם</th><th>טלפון</th><th>תאריך לידה</th></tr><tr><td>שלום</td><td dir="ltr">0500000000</td><td>17/10</td></tr><tr><td>נועה</td><td dir="ltr">0500000001</td><td>25/12/1998</td></tr></table><p>2 רשומות תקינות להוספה</p>${action('✓ יבוא הרשומות התקינות',true)}</div><p class="note">שמות ומספרים לדוגמה. שמרו טלפונים כטקסט ב־Excel.</p>`],
['06 / תרופות — אתם קובעים את השעות',`<h2>תרופות לפי חלקי היום</h2><div class="card">${field('שם התרופה','השם כפי שנרשם עבורך')}${field('מינון והנחיות','לפי ההנחיות שנקבעו לך')}<p class="note">בחרו חלק יום והזינו את השעה שלכם:</p><div class="check">□ בוקר <span class="time">HH:mm</span></div><div class="check">□ צהריים <span class="time">HH:mm</span></div><div class="check">□ ערב <span class="time">HH:mm</span></div><div class="check">□ לילה <span class="time">HH:mm</span></div><div class="check">✓ תזכורות יומיות פעילות</div>${action('המשך לאישור',true)}</div><p class="note">אפשר לבחור כמה חלקי יום, לשנות שעות או להשהות תזכורות.</p>`],
['07 / חיבור יומן Google',`<h2>יומן Google והתראות</h2><div class="guide">1. הוסיפו את חשבון Google בטלפון.<br><br>2. הפעילו סנכרון יומן בהגדרות החשבון.<br><br>3. חזרו לכאן ואשרו קריאת יומן.</div>${action('▦ אישור קריאת יומן',true)}<div class="card"><h3>בחירת יומנים</h3><div class="check">✓ היומן האישי</div><div class="check">□ יומן משפחתי</div>${action('✓ שמירת בחירת היומנים',true)}</div>${action('♧ אישור התראות')}${action('◷ הרשאת תזמון מדויק')}<p class="note">קריאה בלבד, ללא שינוי או מחיקת אירועים.</p>`],
['08 / אתרי חדשות, ספורט ותרבות',`<h2>אתרי חדשות וספורט</h2><p class="sub">מגדירים מקור ואת התחום שלו</p><div class="card">${field('שם האתר','שם מקור החדשות')}${field('קישור RSS או Atom','https://…')}<label class="field">סוג חדשות<select><option>כללי</option><option>ספורט</option><option>בידור ותרבות</option></select></label>${action('בדיקה ושמירה',true)}</div><div class="guide">יש להשתמש בקישור להזנת חדשות, ולא בכתובת דף הבית של האתר. הקישור נבדק לפני שמירה.</div><p class="note">אפשר להוסיף כמה מקורות לכל תחום. אחר כך בוחרים במסך החדשות או אומרים ״חדשות ספורט״.</p>`],
['09 / האייקון והתקנה בטלפון',`<h2>עזרה — בטלפון שלך</h2><img class="icon-preview" src="ezra-icon.svg" alt="אייקון עזרה: בועת שיחה ומיקרופון לבנים על רקע כחול"><p class="center">עזרה - העוזר האישי שלך</p><div class="card"><h3>התקנה לבדיקה</h3><p>1. מעבירים את קובץ ה־APK לטלפון.</p><p>2. פותחים את הקובץ ומאשרים התקנה.</p><p>3. פותחים ״עזרה״ ומגדירים פרטים.</p></div><div class="guide">אין צורך ב־QR או ב־Expo Go.</div><p class="note">לעדכון גרסת הבדיקה הקודמת, מתקינים את ה־APK החדש מעליה. לא מסירים את האפליקציה.</p>`]
];
document.getElementById('board').innerHTML=views.map(([label,body])=>`<section class="screen"><div class="label">${label}</div><div class="phone"><div class="statusbar"><span>09:41</span><span>▰ ▥ ●</span></div><div class="brand"><img src="ezra-icon.svg" alt=""><b>עזרה - העוזר האישי שלך</b><span class="gear">⚙</span></div><div class="content">${body}</div><div class="foot"><button>⌂ בית</button><button class="stop">■ עצור</button></div></div></section>`).join('');
let listening=false;document.getElementById('mic').onclick=()=>{listening=!listening;document.getElementById('live').textContent=listening?'● מקשיב… (הדגמה)':'● מוכן להקשיב'};document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>{listening=false;document.getElementById('live').textContent='ההקראה נעצרה'});
</script></html>
